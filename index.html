<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Нажми на меня</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* Фоновые частицы */
    .bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 100, 150, 0.4);
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* Обёртка кнопки */
    .btn-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Ореол вокруг кнопки */
    .glow-ring {
      position: absolute;
      inset: -20px;
      border-radius: 60% 60% 50% 50%;
      background: radial-gradient(ellipse at center,
        rgba(255, 80, 130, 0.25) 0%,
        transparent 70%
      );
      animation: pulse 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50%       { transform: scale(1.12); opacity: 1; }
    }

    /* Сама кнопка-сердце */
    .heart-btn {
      position: relative;
      width: 200px;
      height: 190px;
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }

    .heart-btn:hover  { transform: scale(1.07); }
    .heart-btn:active { transform: scale(0.95); }

    /* SVG сердечко */
    .heart-btn svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 24px rgba(255, 60, 120, 0.7))
              drop-shadow(0 2px 6px rgba(255, 200, 220, 0.4));
      transition: filter 0.3s ease;
    }

    .heart-btn:hover svg {
      filter: drop-shadow(0 12px 32px rgba(255, 60, 120, 0.9))
              drop-shadow(0 4px 10px rgba(255, 200, 220, 0.6));
    }

    /* Текст внутри кнопки */
    .btn-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 28px 20px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #fff;
      text-shadow:
        0 1px 4px rgba(0,0,0,0.5),
        0 0 12px rgba(255,255,255,0.3);
      line-height: 1.35;
      pointer-events: none;
      user-select: none;
    }

    /* Подпись снизу */
    .hint {
      color: rgba(255, 160, 185, 0.6);
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1; }
    }

    /* Всплеск при клике */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transform: scale(0);
      animation: ripple-anim 0.6s ease-out forwards;
      pointer-events: none;
    }

    @keyframes ripple-anim {
      to { transform: scale(4); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Фоновые частицы -->
  <div class="bg" id="bg"></div>

  <div class="btn-wrapper">
    <div class="glow-ring"></div>

    <button class="heart-btn" id="heartBtn" title="Нажми на меня!">
      <svg viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Основной градиент -->
          <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#ff6eb4"/>
            <stop offset="35%"  stop-color="#ff2d78"/>
            <stop offset="70%"  stop-color="#e8004e"/>
            <stop offset="100%" stop-color="#c0003c"/>
          </linearGradient>
          <!-- Блик сверху -->
          <linearGradient id="shineGrad" x1="20%" y1="0%" x2="80%" y2="60%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.45)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
          <!-- Закруглённый фильтр -->
          <filter id="soft">
            <feGaussianBlur stdDeviation="1.2" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>

        <!-- Основная форма сердца -->
        <path d="M100 170
                 C60 145, 10 110, 10 65
                 C10 35, 30 15, 55 15
                 C70 15, 85 25, 100 40
                 C115 25, 130 15, 145 15
                 C170 15, 190 35, 190 65
                 C190 110, 140 145, 100 170 Z"
              fill="url(#heartGrad)"
              rx="20"/>

        <!-- Блик -->
        <path d="M100 170
                 C60 145, 10 110, 10 65
                 C10 35, 30 15, 55 15
                 C70 15, 85 25, 100 40
                 C115 25, 130 15, 145 15
                 C170 15, 190 35, 190 65
                 C190 110, 140 145, 100 170 Z"
              fill="url(#shineGrad)"
              opacity="0.6"/>
      </svg>

      <span class="btn-text">Привет,<br>нажми на меня!</span>
    </button>

    <span class="hint">♥ tap me ♥</span>
  </div>

  <script>
    // --- Частицы ---
    const bg = document.getElementById('bg');
    const PARTICLE_COUNT = 30;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 5 + 2;
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        width: ${size}px;
        height: ${size}px;
        animation-duration: ${Math.random() * 8 + 6}s;
        animation-delay: ${Math.random() * 10}s;
        background: rgba(${220 + Math.random()*35}, ${50 + Math.random()*80}, ${100 + Math.random()*80}, 0.5);
      `;
      bg.appendChild(p);
    }

    // --- Кнопка ---
    const btn = document.getElementById('heartBtn');

    btn.addEventListener('click', function (e) {
      // Эффект всплеска
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      ripple.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${e.clientX - rect.left - size / 2}px;
        top:  ${e.clientY - rect.top  - size / 2}px;
      `;
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());

      // Открыть ссылку в новой вкладке
      setTimeout(() => {
        window.open('http://localhost:3000', '_blank');
      }, 150);
    });
  </script>
</body>
</html>
